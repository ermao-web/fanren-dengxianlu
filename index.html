function runBattle(card, foe, mode, recovering, done){
  const b = card.ef.battle;
  const L = [];
  const lines = [];
  let pk = 1.0, edmM = 1.0, pwScale = 1.0, extra = [];
  const stFull = stats();            // 未碎器前的属性：祭器前两轮用这份

  if(mode==='wit'){ pk = 0.75; edmM = 0.50; }
  if(mode==='help'){
    pwScale = 0.55;
    if(S.sect && S.contrib>=20){ S.contrib -= 20; extra.push('派系 −20'); }
    else if(S.sect){ S.contrib = Math.max(0, S.contrib-5); extra.push('人情 −1 · 贡献 −5'); }
    else{
      const ks = Object.keys(S.rel).filter(n=>S.rel[n]>=1);
      if(ks.length){ S.rel[ks[0]] -= 1; extra.push('与'+ks[0]+' −1'); }
    }
  }
  let brokeItem = null;
  if(mode==='sac'){
    const slot = S.equip.treasure ? 'treasure' : 'weapon';
    brokeItem = S.equip[slot];
    S.equip[slot] = null;
  }
  if(mode==='yield'){
    const loss = Math.min(S.ss, Math.round(foe.pw*0.5));
    S.ss -= loss;
    S.fame = Math.max(0, S.fame-3);
    S.dao = Math.max(0, S.dao-1);
    S.enemy += 1;
    entry('', '', '你把东西留下，低头走了。身后没有追来——它没有追的必要。',
      '示弱 · 灵石 −'+loss+' · 声望 −3 · 道心 → '+DAO[S.dao][0]+' · 仇家 +1');
    note(4, '示弱 · 灵石 −'+loss);
    recomputeBound(); renderAll();
    return done();
  }
  if(mode==='flee'){
    const st0 = stats();
    const p = clamp(0.35 + (st0.esc/(foe.pw*0.5))*0.30 + (function(){const m=mainArt(); return (m&&m.type==='遁法')?m.lv*0.06:0;})()
              + (st0.def/Math.max(1,foe.atk))*0.15 - (b.ambush?0.20:0), 0.10, 0.85);
    const roll = Math.random(), ok = roll < p;
    entry('', '你选了：遁走', ok ? '你抽身往后退。它没有追上来——也许是不想，也许是没能。'
                                : '你转身就跑，可它比你以为的快。',
      'P_flee = '+Math.round(p*100)+'% · 骰 '+Math.round(roll*100)+' · '+(ok?'<span class="pos">脱身</span>':'<span class="neg">追击</span>'));
    if(ok){
      S.fame = Math.max(0, S.fame-1);
      if(Math.random()<0.20) S.dao = Math.max(0, S.dao-1);
      L.push('声望 <span class="neg">−1</span>');
      note(4, '遁走 · 安然脱身');
      entry('', '结算', '', L.join(' · '));
      renderAll();
      return done();
    }
    const dmg = Math.max(1, Math.round(foe.atk*rnd(0.85,1.15) - st0.def*0.5));
    S.hp -= dmg;
    const ssLoss = Math.min(S.ss, Math.round(foe.pw*0.5));
    S.ss -= ssLoss; S.fame = Math.max(0, S.fame-2);
    let daoLine = '';
    if(Math.random()<0.30){ S.dao = Math.max(0, S.dao-1); daoLine = ' · 道心 → '+DAO[S.dao][0]; }
    entry('', '', '背心上挨了一下，你还手不得，只能跑。',
      '追击 · 气血 <span class="neg">−'+dmg+'</span> · 灵石 <span class="neg">−'+ssLoss+'</span> · 声望 <span class="neg">−2</span>'+daoLine);
    note(3, '遁走失败 · 气血 −'+dmg);
    recomputeBound();
    if(S.hp<=0){ S.hp=0; note(4, '遁走不成 · 毙于'+esc(foe.n)); renderAll(); return endGame('battle'); }
    renderAll();
    if(S.lifespan<=S.age){ note(2, '寿元耗尽'); return endGame('dead'); }
    return done();
  }

  // 正常交手
  const st0 = stats();
  let pAtk0 = st0.atk, pDef0 = st0.def;
  if(recovering){ pAtk0 *= 0.7; pDef0 *= 0.7; }
  // 祭器：前两轮沿用碎器前的攻击，之后按新的（更低的）攻击结算
  let atkFull = stFull.atk; if(recovering) atkFull *= 0.7;
  let eAtkE = foe.atk*pwScale, eDefE = foe.def*edmM, eHpE = Math.round(foe.hp*pwScale);
  let round = 0, critR = 0.10, missR = 0.08;
  const m0 = mainArt();
  if(S.rootEl==='火') critR += 0.03;
  if(m0 && m0.type==='攻伐' && m0.lv>=2) critR += 0.02;
  if(m0 && m0.type==='遁法') missR = Math.max(0, missR - m0.lv*0.015);

  if(brokeItem){
    entry('', '', '你把'+esc(brokeItem.n)+'捏在手里，然后用力一握。它断了——那一瞬间你身上腾起一股劲。',
      '祭器 · '+esc(brokeItem.n)+' 碎裂 · 前 2 轮 ATK ×1.60');
  }
  const modeText = {fight:'力战', wit:'智取', help:'求援', sac:'祭器'}[mode] || mode;
  entry('', '你选了：'+modeText, '两下就撞在了一处。',
    'K_p='+pk+' · 敌 DEF ×'+edmM+' · 敌 pw ×'+pwScale+(extra.length?' · '+extra.join(' · '):''));

  while(round < R_MAX){
    round++;
    const kp = (mode==='sac' && round<=2) ? pk*1.60 : pk;
    let curAtk = (mode==='sac' && round<=2) ? atkFull : pAtk0;
    let crit=false, miss=false;
    let r1 = Math.random();
    if(r1 < critR) crit = true; else if(r1 > 1-missR) miss = true;
    let dp = Math.max(1, curAtk*kp*rnd(0.85,1.15) - eDefE*0.5);
    if(crit) dp *= 1.60;
    if(miss) dp *= 0.20;
    dp = Math.max(1, Math.round(dp));
    eHpE -= dp;

    let cen = '';
    if(crit) cen='暴击 ×1.60 → ';
    if(miss) cen='失手 ×0.20 → ';
    if(eHpE<=0){
      lines.push('轮'+round+' 你 −'+dp+' → 敌倒 '+cen);
      break;                                     // 胜负已分，过程统一在下方输出
    }
    let de = Math.max(1, Math.round(eAtkE*rnd(0.85,1.15) - pDef0*0.5));
    S.hp -= de;
    lines.push('轮'+round+' 你 −'+dp+' → 敌 '+Math.max(0,eHpE)+' ｜ 敌 −'+de+' → 你 '+Math.max(0,S.hp)+' '+cen);
    if(S.hp<=0){ S.hp=0; break; }
  }

  const resolved = eHpE<=0 ? 'win' : (S.hp<=0 ? 'lose' : 'stall');
  const ratio = clamp(S.hp/Math.max(1,st0.hpMax), 0, 1);
  entry('', '交手经过', '', '<div class="engine">'+lines.join('<br>')+'</div>');
  return afterBat(ratio, foe, card, done, [], resolved, mode);
}

function afterBat(ratio, foe, card, done, tags, resolved, mode){
  const b = card.ef.battle || {};
  const L = [];
  const outcome = resolved || 'stall';            // 'win' | 'lose' | 'stall'
  const win = (outcome==='win');

  if(S.hp<=0 || outcome==='lose'){
    S.hp = 0;
    note(4, '战死于'+esc(foe.n));
    entry('big','','你倒下了。最后看见的是它低下来的脸。', '<span class="neg">hp ≤ 0 · 终局 T1 战死</span>');
    renderAll();
    return endGame('battle');
  }

  let lootMul = 1.0;
  if(mode==='wit') lootMul = 0.6;
  if(mode==='help') lootMul = 0.4;
  if(outcome==='stall') lootMul = Math.min(lootMul, 0.3);

  // 后果分档
  const st0 = stats();
  let tier5 = ratio>=0.80 ? 0 : ratio>=0.45 ? 1 : ratio>=0.15 ? 2 : 3;
  if(outcome==='stall' && tier5<2) tier5 = 1;
  const words = ['无伤','轻伤','重伤','濒死'];
  const prose = [
    '你抖了抖袖子，什么也没缺。',
    '身上添了几道口子，走得动，也就算了。',
    '你赢了，可你站不住了。血顺着裤管往下淌，一步比一步沉。',
    '你最后是自己爬出来的。那一路上，你数不清自己歇了多少回。'
  ];
  const tIcon = ['','','',''];
  if(tier5>=2){
    if(tier5===2){ S.wound = clamp(S.wound+0.08,0,0.50); S.woundTurns = Math.max(S.woundTurns, ri(1,3)); }
    else         { S.wound = clamp(S.wound+0.15,0,0.50); S.woundTurns = Math.max(S.woundTurns, ri(2,4));
                   if(Math.random()<0.50) S.dao = Math.max(0, S.dao-1); }
    const ll = tier5===2 ? ri(1,3) : ri(4,8);
    S.lifespan -= ll;
    L.push('寿元 <span class="neg">−'+ll+' 载</span>');
    L.push('气血上限 <span class="neg">−'+(tier5===2?8:15)+'%</span>');
    L.push('疗养 <span class="neg">'+S.woundTurns+' 回合</span>');
    note(3, words[tier5]+' · 寿元 −'+ll+' 载');
    // 装备受损
    const worn = [];
    SLOTS.forEach(sl=>{ if(S.equip[sl[0]]) worn.push(sl[0]); });
    if(worn.length){
      const sk = pick(worn); const it = S.equip[sk];
      const before = it.dur||0;
      if(before>=2){ S.equip[sk]=null; L.push(esc(it.n)+' <span class="neg">碎裂</span>'); note(7, esc(it.n)+'碎裂'); }
      else { it.dur = before+1; L.push(esc(it.n)+' <span class="neg">'+DUR_N[it.dur]+'</span>'); }
    }
  }else{
    note(3, words[tier5]);
  }
  entry('big','', win
      ? (tier5<=1 ? '它倒了。你站在原地喘了一会儿，然后才敢走过去。' : prose[tier5])
      : '谁也没赢。这样耗下去，先撑不住的一定是你——你先松了手。',
    words[tier5]+' · hp '+S.hp+'/'+st0.hpMax+' = '+Math.round(ratio*100)+'% · '+(win?'<span class="pos">胜</span>':'<span class="neg">僵持</span>')
    + (tier5>=2?(' · 伤势累积 '+Math.round(S.wound*100)+'%'):''));

  // 功法熟练（战斗来源）
  if(win){
    const mv = mainArt();
    if(mv){
      const diff = clamp((foe.pw/Math.max(1,st0.power)-1), 0, 2);
      const base  = diff>0.8?12 : diff>0.4?8 : diff>0?5 : 3;
      const up = addArtExp(mv, base);
      L.push('主修熟练 <span class="pos">+'+Math.round(base*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      if(up>0) note(7, '《'+esc(mv.n)+'》→'+ART_LV[mv.lv]);
    }
  }

  // 战利品
  const LT = LOOT_TBL[b.loot] || LOOT_TBL['凡缘'];
  let got = [];
  if(win || outcome==='stall'){
    const sl = Math.round(ri(LT.ss[0], LT.ss[1]) * lootMul);
    if(sl>0){ S.ss += sl; got.push('灵石 +'+sl); }
    const hb = Math.round(ri(LT.herb[0], LT.herb[1]) * lootMul);
    if(hb>0){ S.herb += hb; got.push('药材 +'+hb); }
    const ma = Math.round(ri(LT.mat[0], LT.mat[1]) * lootMul);
    if(ma>0){ S.mat += ma; got.push('灵材 +'+ma); }
    const fa = Math.round(LT.fame * lootMul);
    if(fa>0){ S.fame += fa; got.push('声望 +'+fa); }
    if(Math.random() < LT.drop*lootMul){
      const it = gradeDrop(b.loot);
      if(bagRoom()>0){ S.bag.push(it); got.push('得 '+esc(it.n)+'（'+GRADE_N[it.g]+'）'); note(7,'战利 '+esc(it.n)); }
      else{
        const w = destroyWeakest();
        const v = sellItem(w||it);
        if(w){ S.bag.push(it); got.push('囊满，折去'+esc(w.n)+' 得 '+v+' 灵石'); }
        else got.push('囊满，'+esc(it.n)+'折价 '+v+' 灵石');
        S.ss += v;
      }
    }
    if(win && Math.random() < (LOOT_ART[b.loot]||0)){
      const REST = CARDS.filter(c=>c.c==='功法' && eligible(c) && c.ef && c.ef.art);
      if(REST.length){
        const c2 = pick(REST);
        const sub = [];
        giveArt(c2.ef.art, sub);
        got.push('功法残篇 · '+sub.join(' '));
      }
    }
  }
  if(got.length){
    note(6, got.slice(0,2).join(' · '));
    entry('', '', '你把它翻了个遍。', '<span class="pos">'+got.join(' · ')+'</span>'+(lootMul<1?(' · 战利品 ×'+lootMul):''));
  }
  if(L.length) entry('', '结算', '', L.join(' · '));

  recomputeBound();
  if(S.lifespan <= S.age){ renderAll(); return endGame('dead'); }
  renderAll();
  return done();
}

/* ---------- 17. 大境界突破 ---------- */
function brkTerms(force){
  const st = S.stage;
  const base_ = st===9?0.42 : st===12?0.32 : 0.24;
  const daoM  = DAO[S.dao][1];
  const boneM = (S.bone-50)/100*0.20;
  const rootM = (typeof S.rootPtr==='number') ? S.rootPtr : (P_ROOTSTEP[S.rootGrade]||0);
  const m0 = mainArt();
  const artM = m0 ? [0,0.02,0.05,0.08,0.12][clamp(m0.lv,0,4)] : -0.05;
  const hasDan = S.pill>0;
  const danM = hasDan ? 0.10 : -0.10;
  let guardM = -0.10, guardTxt = '无人护法';
  if(S.sect){
    if(S.sect.rank>=3){ guardM = 0.08; guardTxt = '长老护法'; }
    else { guardM = 0.04; guardTxt = '同门护法'; }
  }
  if(S.guard>0){ guardM = Math.min(0.08, guardM + 0.06*S.guard); guardTxt += '＋阵法'; }
  const qi = LOCS[S.loc].qi;
  const qiM = qi>=60 ? 0.05 : qi<30 ? -0.05 : 0;
  const left2 = lifeLeft();
  const ageM = left2<=10 ? -0.10 : left2>=60 ? 0.05 : 0;
  const tries = S.breakTry[st]||0;
  const tryM  = tries>=2 ? 0.05*(tries-1) : 0;            // 第 3 次起 +5%/次（D3 推荐值）
  let sum = base_+daoM+boneM+rootM+artM+danM+guardM+qiM+ageM+tryM;
  if(force) sum *= 0.5;
  const p = clamp(sum, 0.05, 0.85);
  return {st:st, base_:base_, daoM:daoM, boneM:boneM, rootM:rootM, artM:artM, hasDan:hasDan, danM:danM,
          guardM:guardM, guardTxt:guardTxt, qi:qi, qiM:qiM, left2:left2, ageM:ageM, tries:tries, tryM:tryM,
          p:p, m0:m0};
}
function brkWords(p){ return p>=0.65 ? '根基扎实' : p>=0.25 ? '看运气' : '凶险'; }
function brkEngine(t){
  return '<div class="prow"><span>把握</span><span>'+brkWords(t.p)+'</span></div>'
    + '<div class="engine">P = base '+Math.round(t.base_*100)+'% + 道心 '+Math.round(t.daoM*100)+'% + 根骨 '+Math.round(t.boneM*100)
    + '% + 灵根 '+Math.round(t.rootM*100)+'% + 功法 '+Math.round(t.artM*100)+'% + 丹药 '+Math.round(t.danM*100)
    + '% + 护法 '+Math.round(t.guardM*100)+'% + 地脉 '+Math.round(t.qiM*100)+'% + 寿元 '+Math.round(t.ageM*100)
    + '% + 屡败 '+Math.round(t.tryM*100)+'% → <b>'+Math.round(t.p*100)+'%</b></div>';
}
function promptBreakthrough(done){
  const t = brkTerms(false);
  const toStage = STAGES[clamp(S.stage+1,0,STAGES.length-1)];
  entry('big','', BIG[S.stage]+' 的关口横在你面前。你闭了关。', null);
  const opts = [
    {k:'go',    lb:'冲 关',   d: t.hasDan ? '服一颗丹，把那口气顶上去。' : '手上没有破境丹，这一冲要硬来。', dis: S.breakCd>0},
    {k:'force', lb:'强 行 冲 关', d:'不管那道伤，也不管时候对不对。把握减半，代价加倍。'},
    {k:'wait',  lb:'按 捺 不 动', d:'再攒一攒。关口不会跑，寿元会。'}
  ];
  askChoice('冲 境 · '+toStage, '你的把握——'+brkWords(t.p)+'。这一步迈出去，就收不回来了。',
    brkEngine(t)
    + '<div class="engine">冷却 '+(S.breakCd>0?(S.breakCd+' 年'):'无')+' · 余寿 '+lifeLeft()+' 载 · 主修 '
      + (t.m0?(esc(t.m0.n)+' · '+ART_LV[t.m0.lv]):'无（根基不齐）')+' · 已冲 '+(S.breakTry[S.stage]||0)+' 次</div>',
    opts, k=>{
      if(k==='wait'){
        entry('', '', '你把那口气又压了回去。来日方长——如果还有来日。',
          '放弃冲境 · 修为 '+S.progress+'/'+stepText()+' 封顶保存');
        note(1, '按捺不动');
        renderAll();
        return done();
      }
      doBreakthrough(k==='force', done);
    });
}
function doBreakthrough(force, done){
  const st = S.stage;
  const t = brkTerms(force);
  const roll = Math.random(), ok = roll < t.p;
  const F = BRK_FAIL[st] || BRK_FAIL[9];
  let consumed = false;
  if(t.hasDan){ S.pill--; consumed = true; }
  let eng = brkEngine(t) + '<div class="engine">骰 '+Math.round(roll*100)+' → <b>'+(ok?'成功':'失败')+'</b>'
          + (consumed?' · 服丹 ×1':'') + (force?' · 强行 ×0.50':'') + '</div>';

  S.breakTry[st] = (S.breakTry[st]||0) + 1;

  if(ok){
    const oldCap = S.lifespan;
    S.progress = Math.max(0, S.progress - (isFinite(curStep())?curStep():0));
    S.stage = Math.min(STAGES.length-1, st+1);
    S.lifespan = Math.max(S.lifespan, LIFE_CAP[S.stage]);
    S.wound = clamp(S.wound - 0.05, 0, 0.50);
    S.breakCd = 0;
    let guardLife = '';
    if(S.lifespan <= S.age){ S.lifespan = S.age+5; guardLife = '吊住一口气 · '; }
    recomputeBound();
    entry('big','', '通了。丹田里那口气忽然落了地，落进了一片你从没到过的地方。', eng);
    entry('sys','','境界提升 → '+STAGES[S.stage]+' ｜ 寿元上限 '+oldCap+' → '+S.lifespan+' 载'
      + (guardLife?'（'+guardLife+'）':''), '旧伤痊愈 −5% · 永久伤累计 '+Math.round(S.wound*100)+'%');
    note(1, '冲境成功 → '+STAGES[S.stage]);
    checkLoc(); renderAll();
    return done();
  }

  // 失败
  const stepv = isFinite(curStep()) ? curStep() : 0;
  S.progress = Math.round(stepv * F.back);
  S.lifespan += F.life;
  S.wound = clamp(S.wound + Math.abs(F.hp), 0, 0.50);
  S.dao = Math.max(0, S.dao-1);
  S.breakCd = F.cd;
  let extra = [];
  if(!t.hasDan){ S.lifespan -= 3; extra.push('无丹强冲 −3 载'); }
  if(t.left2 <= 5){ S.lifespan -= 3; extra.push('寿元不足仍冲 −3 载'); }
  if(force){ S.lifespan -= 8; S.wound = clamp(S.wound+0.10,0,0.50); extra.push('强行 −8 载 −10% 气血上限'); }
  if(Math.random() < F.fire){
    S.progress = Math.max(0, Math.round(S.progress*0.90));
    extra.push('走火入魔 修为 −10%');
  }
  if(F.dur){
    const worn = SLOTS.map(s=>s[0]).filter(k=>S.equip[k]);
    if(worn.length){
      const sk = pick(worn), it = S.equip[sk];
      if((it.dur||0)>=2){ S.equip[sk]=null; extra.push(esc(it.n)+'碎裂'); }
      else { it.dur=(it.dur||0)+1; extra.push(esc(it.n)+DUR_N[it.dur]); }
    }
  }
  if(!mainArt()){ S.progress = Math.max(0, Math.round(S.progress*0.90)); extra.push('无根之木 修为 −10%'); }
  const after = stats();
  if(S.hp > after.hpMax) S.hp = after.hpMax;
  entry('big','', '没通。那口气冲上去，又折了回来，撞得你五脏发颤。你还停在'+STAGES[st]+'。', eng);
  entry('sys','','修为回退至 '+Math.round(F.back*100)+'% ｜ 寿元 '+F.life+' 载 ｜ 气血上限 −'+Math.round(Math.abs(F.hp)*100)
    + '% ｜ 道心 → '+DAO[S.dao][0]+' ｜ 冷却 '+F.cd+' 年',
    (extra.length?('额外 · '+extra.join(' · ')+' · '):'')+'D3 屡败补偿 · 已冲 '+(S.breakTry[st]||0)+' 次');
  note(1, '冲境失败 · 寿元 '+F.life+' 载');
  renderAll();
  if(S.lifespan <= S.age){ return endGame('gate'); }
  return done();
}

/* ---------- 18. 结算一张卡 ---------- */
function applyCard(c){
  const e = c.ef || {};
  const L = [];
  const st0 = stats();

  if(e.cultivate){
    let base = e.cultivate;
    if(S.woundTurns>0) base *= 0.5;
    if(base>0){
      const gain = Math.max(1, Math.round(base * coef() * S.rootMul * S.boneMul * st0.cult * poisonMul() * rnd(0.9,1.1)));
      S.progress += gain;
      L.push('修为 <span class="pos">+'+gain+'</span>');
      note(5, '修为 +'+gain);
    }else{
      S.progress = Math.max(0, S.progress + Math.round(base*coef()));
      L.push('修为 <span class="neg">'+Math.round(base*coef())+'</span>');
    }
  }
  if(e.progressPct){
    const loss = Math.round((isFinite(curStep())?curStep():200)*Math.abs(e.progressPct));
    S.progress = Math.max(0, S.progress-loss);
    L.push('修为 <span class="neg">−'+loss+'</span>');
  }
  if(e.ss){ S.ss = Math.max(0, S.ss+e.ss); L.push('灵石 '+signed(e.ss)); note(6,'灵石 '+(e.ss>0?'+':'')+e.ss); }
  if(e.herb){ S.herb = Math.max(0, S.herb+e.herb); L.push('药材 '+signed(e.herb)); }
  if(e.material){ S.mat = Math.max(0, S.mat+e.material); L.push('灵材 '+signed(e.material)); note(6,'灵材 +'+e.material); }
  if(e.pill){ S.pill = Math.max(0, S.pill+e.pill); L.push('丹药 '+signed(e.pill)); }
  if(e.fame){ S.fame = Math.max(0, S.fame+e.fame); L.push('声望 '+signed(e.fame)); }
  if(e.contrib){
    S.contrib = Math.max(0, S.contrib+e.contrib);
    L.push(esc(FACTIONS[S.sect?S.sect.id:'qy'].axis)+' '+signed(e.contrib));
    checkRank(L);
    note(8, '贡献 '+(e.contrib>0?'+':'')+e.contrib);
  }
  if(e.danPoison){ S.danPoison = Math.max(0, S.danPoison+e.danPoison); L.push('丹毒 '+signed(e.danPoison)); }
  if(e.debts){ S.debts += e.debts; L.push('添了一桩 <span class="neg">未了的人情</span>'); }
  if(e.enemy){ S.enemy += e.enemy; L.push('多了一个 <span class="neg">仇家</span>'); }
  if(e.rel){
    const n = e.rel.n; S.rel[n] = (S.rel[n]||0) + e.rel.v;
    L.push('与 <span class="pos">'+esc(n)+'</span> 的关系 '+signed(e.rel.v));
  }
  if(e.atk){ S.atkBonus += e.atk; L.push('攻击 <span class="pos">+'+e.atk+'</span>'); }
  if(e.def){ S.defBonus += e.def; L.push('防御 <span class="pos">+'+e.def+'</span>'); }
  if(e.guard){ S.guard += e.guard; L.push('护法 <span class="pos">+'+e.guard+'</span>'); }
  if(e.rep && e.rep.id){ S.rep[e.rep.id] = (S.rep[e.rep.id]||0) + (e.rep.v||0); L.push('派系声望 '+signed(e.rep.v)); }
  if(e.lifespan){
    S.lifespan += e.lifespan;
    L.push('寿元 <span class="'+(e.lifespan>0?'pos':'neg')+'">'+(e.lifespan>0?'+':'')+e.lifespan+' 载</span>');
    note(2, '寿元 '+(e.lifespan>0?'+':'')+e.lifespan+' 载');
  }
  if(e.dao){
    const b0 = S.dao;
    S.dao = clamp(S.dao+e.dao, 0, DAO.length-1);
    if(S.dao!==b0) L.push('道心 <span class="'+(e.dao>0?'pos':'neg')+'">'+DAO[b0][0]+' → '+DAO[S.dao][0]+'</span>');
    note(8, '道心 → '+DAO[S.dao][0]);
  }
  if(e.art){ giveArt(e.art, L); }
  if(e.artExp){
    const mv = mainArt() || S.arts[0];
    const v0 = (typeof e.artExp==='number') ? e.artExp : (e.artExp.v||8);
    if(mv){
      const up = addArtExp(mv, v0);
      L.push('《'+esc(mv.n)+'》熟练 <span class="pos">+'+Math.round(v0*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      if(up>0 && mv.type==='养元'){
        if(mv.lv===3){ S.lifespan += 8; L.push('养元圆满 <span class="pos">寿元 +8 载</span>'); note(2,'寿元 +8 载'); }
        if(mv.lv===4){ S.lifespan += 12; L.push('养元化境 <span class="pos">寿元 +12 载</span>'); note(2,'寿元 +12 载'); }
      }
      note(7, '《'+esc(mv.n)+'》熟练 +'+v0);
    }else L.push('无门径可归，白白磨了一场');
  }
  if(e.arts){                                     // 旧字段：术法式数 → 主修熟练
    const mv = mainArt() || S.arts[0];
    const v0 = e.arts*12;
    if(mv){
      const up = addArtExp(mv, v0);
      L.push('术法精进 <span class="pos">+'+Math.round(v0*WX_EXP[wxRel(S.rootEl,mv.el)])+'</span>'+(up>0?(' 晋 '+ART_LV[mv.lv]):''));
      note(7, '术法精进');
    }else L.push('习得零散术法，尚无门径可归');
  }
  if(e.mainArt){                                  // 旧字段
    const mul = OLD_ART[e.mainArt] || ['无','养元'];
    giveArt({n:e.mainArt, el:mul[0], type:mul[1]}, L);
  }
  if(e.hp && e.hp.pct){
    const st = stats();
    const d = Math.round(st.hpMax*e.hp.pct);
    S.hp = Math.max(1, Math.min(st.hpMax, S.hp + d));
    L.push('气血 <span class="'+(d>0?'pos':'neg')+'">'+(d>0?'+':'')+d+'</span>');
  }
  if(e.hpMax && e.hpMax.pct){
    const d0 = e.hpMax.pct;
    if(d0<0){ S.wound = clamp(S.wound + Math.abs(d0), 0, 0.50); }
    else    { S.wound = clamp(S.wound - Math.abs(d0), 0, 0.50); }
    L.push('气血上限 <span class="'+(d0>0?'pos':'neg')+'">'+(d0>0?'+':'')+Math.round(d0*100)+'%</span>');
    note(3, '气血上限 '+(d0>0?'+':'')+Math.round(d0*100)+'%');
  }
  if(e.heal && e.heal.pct){
    const st = stats();
    const mul = 1 + (S.rootEl==='水'?0.15:0) + st.healB;
    const g = Math.round(st.hpMax*e.heal.pct*mul);
    S.hp = Math.min(st.hpMax, S.hp + g);
    L.push('气血 <span class="pos">+'+g+'</span>');
    note(3, '疗伤 +'+g);
  }
  if(e.cure){
    S.woundTurns = 0;
    L.push('伤势稳住了（疗养清零）');
  }
  if(e.wound){
    const w = {light:1, heavy:2, mortal:3}[e.wound];
    if(w){
      if(w===2){ S.wound=clamp(S.wound+0.08,0,0.50); S.woundTurns=Math.max(S.woundTurns,ri(1,3)); }
      if(w===3){ S.wound=clamp(S.wound+0.15,0,0.50); S.woundTurns=Math.max(S.woundTurns,ri(2,4)); }
      L.push('伤势 · '+['','轻伤','重伤','濒死'][w]);
      note(3, ['','轻伤','重伤','濒死'][w]);
    }
  }
  if(e.sect===true || e.sectJoin){
    const nm = (e.sectJoin && typeof e.sectJoin==='string') ? e.sectJoin : '青云宗';
    joinFaction(facIdOf(nm) || 'qy', L, !!S.swFrom);
    S.swFrom = null;                                // 一次性凭证：仅本次结算视为「改投」
  }
  if(e.locate!=null){
    const i = LOC_INDEX[e.locate];
    if(i!=null && i!==S.loc){
      S.loc = i;
      if(S.seen.indexOf(i)<0) S.seen.push(i);
      if(S.nextLoc===i){ S.nextLoc=null; S.nudge=0; }
      L.push('身在 <span class="pos">'+LOCS[i].name+'</span>');
    }
  }
  if(c.c==='抉择' && c.t==='散修的路') S.declined = true;
  return L;
}

function checkRank(L){
  if(!S.sect) return;
  const F = FACTIONS[S.sect.id];
  while(S.sect.rank < F.ranks.length-1 && S.contrib >= F.need[S.sect.rank+1]){
    S.sect.rank++;
    L.push('门庭晋升 · <span class="pos">'+F.ranks[S.sect.rank]+'</span>');
    note(8, FACTIONS[S.sect.id].n+' → '+F.ranks[S.sect.rank]);
  }
}
/* 改投的代价：原派系贡献清零 + 声望受损 + 与原派系敌对上升。
   只在 askChoice 确认后调用 —— 不得静默发生（FDR-007 P0-2） */
function switchCost(from, L){
  const F = FACTIONS[from];
  const dF = Math.min(SWITCH_COST.fame, S.fame);
  S.fame = Math.max(0, S.fame - SWITCH_COST.fame);
  S.rep[from] = (S.rep[from]||0) + SWITCH_COST.rep;      // 负值 → 与原派系敌对上升
  L.push('<span class="neg">改投代价</span> · 声望 −'+dF+' · '+esc(F.n)+'敌对上升');
  note(8, '改投代价 · 离 '+F.n);
}

/* id 派系；isSwitch=true 表示这是跨门庭的改投（已确认），须付代价 */
function joinFaction(id, L, isSwitch){
  if(!FACTIONS[id]) return;
  const F = FACTIONS[id];
  const from = S.sect ? S.sect.id : null;

  /* D6：商盟是生意不是门庭，可与另一派系并存 —— 本派贡献不该被清零 */
  if(id==='hs' && from && from!=='hs'){
    S.trade = 'hs';
    L.push('兼了 <span class="pos">'+F.n+'</span> 的生意 · '+F.ranks[0]+'<em>'+esc(FACTIONS[from].n)+' 未退</em>');
    note(8, '兼 '+F.n);
    return;
  }
  const hadCon  = S.contrib;                                   // 记录要在改动 S.sect 之前取
  const hadRank = from ? clamp(S.sect.rank, 0, FACTIONS[from].ranks.length-1) : 0;
  if(from==='hs' && id!=='hs'){ S.trade='hs'; S.sect=null; }   // 本门原是商盟 → 转投别家，商路仍然留着

  if(isSwitch && from) switchCost(from, L);

  S.sect = {id:id, rank:0};
  S.contrib = 0;                                          // 换了门庭，贡献从头算起
  L.push('入了 <span class="pos">'+F.n+'</span> · '+F.ranks[0]);
  if(isSwitch && from){
    L.push('原门庭 <span class="neg">'+esc(FACTIONS[from].n)+' · '+FACTIONS[from].ranks[hadRank]+' 的'
           +esc(FACTIONS[from].axis)+'清零</span>（原文 '+hadCon+'）');
  }
  note(8, (isSwitch && from ? '改投 ' : '入 ')+F.n);
}

/* ---------- 19. 回合循环 ---------- */
function choose(c){
  if(over || CH) return;
  const from = switchFrom(c);            // FDR-007：已有门庭者遇到别家入伙卡 → 先确认，不得静默改投
  if(from) return askSwitch(c, from);
  doChoose(c);
}

/* 改投确认浮层（卡面/描述零阿拉伯数字，数值一律走下方引擎行） */
function askSwitch(c, from){
  const id = joinTarget(c);
  const nf = FACTIONS[from], nt = FACTIONS[id];
  if(!nf || !nt) return doChoose(c);
  const oldRank = nf.ranks[clamp(S.sect.rank, 0, nf.ranks.length-1)];
  askChoice('改 投 门 庭',
    '你如今是'+esc(nf.n)+'的'+esc(oldRank)+'，攒下的'+esc(nf.axis)+'都在那本册子上。这一脚跨过去，那边就没有你的名字了。',
    '<div class="prow"><span>现门庭</span><span>'+esc(nf.n)+'<em>'+esc(oldRank)+' · '+esc(nf.axis)+' '+S.contrib+'</em></span></div>'
    + '<div class="prow"><span>投向</span><span>'+esc(nt.n)+'<em>'+esc(nt.axis)+' 从零起算</em></span></div>'
    + '<div class="prow"><span>代价</span><span>贡献清零<em>声望 −'+SWITCH_COST.fame+' · '+esc(nf.n)+'声望 '+SWITCH_COST.rep+'</em></span></div>',
    [ {k:1, lb:'改投'+nt.n, d:esc(nf.axis)+'清零 · 声望受损 · 与'+nf.n+'交恶'},
      {k:0, lb:'不去',      d:'这一趟白跑，往后别的事还得有人管。'} ],
    function(k){
      if(k===1){ S.swFrom = from; doChoose(c); return; }
      S.noJoin[c.t] = true;                       // 当面回绝过的入伙卡，不再反复来劝
      const i = (cur.indexOf(c) >= 0) ? cur.indexOf(c)
              : cur.findIndex(x => x.id != null && x.id === c.id);   // 防御：cur 里存的是副本
      const rep = (i >= 0) ? replaceCard(i, c) : null;
      if(i >= 0 && rep) cur[i] = rep;              // 顶替上去，手牌仍是 3 张、类目互异
      entry('', '你把话压了下去', '他们没再劝第二遍。第二天照旧起身，像什么也没发生过。',
        'switch(declined) · '+esc(nt.n)+' 入门卡已屏蔽');
      renderCards();
      if(!rep) afterCard();                       // 防御：换不出别的卡时不容回合空转
    });
}

/* 换掉一张被回绝的卡（保持手牌 3 张、类目互异，且不再抽别的入门卡） */
function replaceCard(idx, old){
  const usedId = {}, usedCat = {};
  cur.forEach((x,i)=>{ if(i!==idx){ if(x.id>=0) usedId[x.id]=1; usedCat[x.c]=1; } });
  const pool = CARDS.map((c,i)=>Object.assign({id:i}, c))
                    .filter(c=>eligible(c) && !usedId[c.id] && !usedCat[c.c] && !joinTarget(c));
  if(!pool.length) return null;
  return pool[wpick(pool.map(c=>TIER_W[c.tier]||1))];
}

function doChoose(c){
  const L = applyCard(c);
  if(turnBox) turnBox._card = c.t;               // 供折叠摘要显示卡名
  entry('choice', '第 '+S.turn+' 年 · 你选了', '《'+esc(c.t)+'》'+esc(c.d), null);
  if(L.length) entry('', '结算', '', L.join(' · '));
  recomputeBound();

  // T2：某些卡直接把寿元压到年岁之下，立即终局（规格 §10.1 lifespan 字段语义）
  if(!over && S.lifespan <= S.age){
    entry('big','','一口气没续上。你坐下去，就没再起来。','<span class="neg">lifespan ≤ age · 终局 T2 寿元耗尽</span>');
    renderAll();
    return endGame('dead');
  }

  S.memory.push({turn:S.turn, ids:cur.map(x=>x.id).filter(id=>id>=0)});
  if(S.memory.length>4) S.memory.shift();
  renderAll();

  if(c.ef && c.ef.battle && typeof c.ef.battle==='object'){
    return beginBattle(c, ()=>{ if(!over) afterCard(); });
  }
  if(c.ef && c.ef.equip){
    const spec = c.ef.equip;
    return giveEquip(spec, ()=>{ if(!over) afterCard(); });
  }
  return afterCard();
}
function afterCard(){
  if(over) return;
  advance();
}

function checkLoc(){
  LOCS.forEach((L,i)=>{
    if(i>0 && S.stage>=L.min && S.seen.indexOf(i)<0){
      S.seen.push(i); S.nextLoc=i; S.nudge=2;
      entry('sys','','你听说南边有个去处 · <b>'+L.name+'</b>', null);
    }
  });
}

function zaihuo(){
  const m0 = mainArt();
  if(!m0) return 0;
  const secs = secArts();
  const conflictsRoot = wxRel(S.rootEl, m0.el)==='ke';
  const conflictArt   = secs.some(s=>wxRel(m0.el,s.el)==='ke');
  let p = 0;
  if(conflictsRoot) p = conflictArt ? 0.12 : 0.05;
  else if(conflictArt) p = 0.06;
  if(p>0 && Math.random()<p){
    S.progress = Math.max(0, Math.round(S.progress*0.90));
    S.wound = clamp(S.wound+0.01, 0, 0.50);
    S.lifespan -= 1;
    S.dao = Math.max(0, S.dao-1);
    note(3, '走火 · 寿元 −1 载');
    entry('sys','','夜里气息忽然岔了。你按了半宿才把它压回去，人却虚了。',
      '走火 · 修为 −10% · 气血上限 −1% · 寿元 −1 载 · 道心 → '+DAO[S.dao][0]+' · P='+Math.round(p*100)+'%');
    return 1;
  }
  return 0;
}

function promoteLoop(){
  let guard = 0;
  while(S.stage < STAGES.length-1 && guard++ < 40){
    const stepv = curStep();
    if(!isFinite(stepv) || S.progress < stepv) break;
    if(BIG[S.stage]) break;                      // 大境界交给突破判定
    S.progress -= stepv;
    S.stage++;
    const cap = LIFE_CAP[S.stage];
    const old = S.lifespan;
    S.lifespan = Math.max(S.lifespan, cap);
    recomputeBound();
    entry('sys','','境界提升 → '+STAGES[S.stage], null);
    if(S.lifespan>old){ entry('sys','','寿元上限提升 '+old+' → '+S.lifespan+' 载', null); note(1,'境界 → '+STAGES[S.stage]); }
    else note(1,'境界 → '+STAGES[S.stage]);
    checkLoc();
  }
}

function advance(){
  // ① 基础吐纳
  S.progress += TUNE;
  // ② 主修功法自然推进 +1；五行适配已在 addArtExp 内
  const mv = mainArt();
  if(mv){
    const beforeLv = mv.lv;
    addArtExp(mv, 1);
    if(mv.lv>beforeLv) entry('sys','','你的《'+esc(mv.n)+'》又深了一层。', '熟练 → '+ART_LV[mv.lv]+' · '+WX_NAME[wxRel(S.rootEl,mv.el)]);
  }
  // ③ 走火判定
  zaihuo();
  // ④ 服丹 + 丹毒代谢
  const st1 = stats();
  let need = 0;
  if(S.hp < st1.hpMax*0.60) need = 1;
  else if(S.progress >= (isFinite(curStep())?curStep():Infinity)*0.80) need = 2;
  if(need>0 && S.pill>0){
    S.pill--;
    S.progress += Math.round(8*coef());
    S.danPoison += 2;
    entry('sys','','你抠出一粒丹咽了下去。','服丹 · 修为 +'+Math.round(8*coef())+' · 丹毒 +2');
  }
  if(S.danPoison>0) S.danPoison = Math.max(0, S.danPoison-1);
  if(S.danPoison>=10){ S.lifespan -= 1; note(2,'丹毒反噬 −1 载'); entry('sys','','你身上的药味越来越重了。','丹毒 ≥10 · 寿元 −1 载'); }
  // ⑤ 派系俸禄
  if(S.sect){
    const inc = FACTIONS[S.sect.id].pay(S.sect.rank);
    S.ss += inc;
  }
  if(S.trade){
    const inc = Math.round(FACTIONS[S.trade].pay(0)*0.5);
    S.ss += inc;
  }
  // ⑥ 阶段推进（大境界处停下）
  promoteLoop();
  recomputeBound();
  renderAll();

  // ⑦ 大境界：交给玩家决断
  if(BIG[S.stage] && isFinite(curStep()) && S.progress >= curStep()){
    if(S.breakCd>0){
      entry('sys','','关口的伤还没养回来。你只能再等。','冷却 '+S.breakCd+' 年 · 可强行冲关');
    }
    return promptBreakthrough(()=>{ if(!over) finishTurn(); });
  }
  return finishTurn();
}

function finishTurn(){
  if(over) return;
  // 年末恢复
  const st = stats();
  let heal = Math.round(st.hpMax*0.08);
  if(S.woundTurns>0){
    heal = Math.round(heal * (S.wound>=0.15?0.20:0.40));
    S.woundTurns--;
    if(S.woundTurns===0) entry('sys','','伤好得差不多了，能动了。','疗养结束');
  }
  if(S.hp < st.hpMax) S.hp = Math.min(st.hpMax, S.hp + heal);
  if(S.breakCd>0) S.breakCd--;

  S.age++; S.turn++;
  recomputeBound();

  // 终局判定
  if(S.hp <= 0){ S.hp=0; note(3, '气血耗尽'); return endGame('battle'); }
  if(S.lifespan <= S.age){ note(2, '寿元耗尽'); return endGame('dead'); }
  if(S.turn > MAX_TURN){ note(1, '安全上限'); return endGame('cap'); }

  renderAll();
  const stg = STAGES[clamp(S.stage,0,STAGES.length-1)];
  openTurn('第 '+S.turn+' 年', stg+' · '+LOCS[S.loc].name+' · '+(S.sect?FACTIONS[S.sect.id].short+FACTIONS[S.sect.id].ranks[clamp(S.sect.rank,0,4)]:'无门无派'), '');
  entry('sys','','时年 '+S.age+' 岁，余寿 '+lifeLeft()+' 载。',
    '吐纳 +'+TUNE+' · 修为 '+S.progress+'/'+stepText()+' · 气血 '+S.hp+'/'+stats().hpMax
    + (S.sect?' · 俸禄 +'+FACTIONS[S.sect.id].pay(S.sect.rank):'')
    + (S.woundTurns>0?' · 疗养中 ×'+(S.wound>=0.15?0.20:0.40):''));
  entry('sys','','三件机缘摆在面前。', null);
  cur = genCards();
  renderCards();
}

/* ---------- 20. 终局 ---------- */
function endGame(reason){
  if(over) return;
  over = true;
  sealTurn();
  const boxes = document.querySelectorAll('.turn');
  Array.prototype.forEach.call(boxes, d=>{ d.open=false; });
  if(boxes.length) boxes[boxes.length-1].open = true;
  $('cards').style.display='none';
  const st = stats();
  let title, desc;
  if(reason==='battle'){
    title='身 死 道 消';
    desc='你没能等到那一步。最后一次交手，你先撑不住了。';
  }else if(reason==='gate'){
    title='殒 于 关 前';
    desc='那一步终究没能迈过去。冲到最后，寿元先尽了。';
  }else if(reason==='cap'){
    title='此 局 终 结';
    desc='这一世长得连记事的人都换了几茬。就到这里吧。';
  }else{
    title='寿 元 耗 尽';
    desc='你停在'+STAGES[clamp(S.stage,0,STAGES.length-1)]+'。回头再看青石镇，已经小得看不清了。';
  }
  $('end-title').textContent = title;
  $('end-desc').textContent  = desc;
  const arts = S.arts.length ? S.arts.map(a=>esc(a.n)+'·'+ART_LV[a.lv]).join('、') : '无';
  const eqn  = SLOTS.map(s=>S.equip[s[0]]).filter(Boolean).length;
  $('end-stat').innerHTML =
      '<div class="prow"><span>最终境界</span><span>'+STAGES[clamp(S.stage,0,STAGES.length-1)]+'<em>修为 '+S.progress+' / '+stepText()+'</em></span></div>'
    + '<div class="prow"><span>享年</span><span>'+S.age+' 岁<em>寿元上限 '+S.lifespan+'</em></span></div>'
    + '<div class="prow"><span>死因</span><span>'+({battle:'战死',dead:'老死',gate:'冲境殒身',cap:'安全上限'}[reason]||'—')+'</span></div>'
    + '<div class="prow"><span>气血 / 攻击 / 防御</span><span>'+S.hp+' / '+st.atk+' / '+st.def+'</span></div>'
    + '<div class="prow"><span>战力（派生）</span><span>'+st.power+'</span></div>'
    + '<div class="prow"><span>灵根 / 根骨</span><span>'+esc(S.rootName)+' · '+S.bone+'</span></div>'
    + '<div class="prow"><span>门庭</span><span>'+(S.sect?(FACTIONS[S.sect.id].n+' · '+FACTIONS[S.sect.id].ranks[clamp(S.sect.rank,0,4)]):'终身散修')+(S.trade?'（兼 '+FACTIONS[S.trade].n+'）':'')+'</span></div>'
    + '<div class="prow"><span>功法</span><span>'+arts+'</span></div>'
    + '<div class="prow"><span>器物</span><span>身上一 '+eqn+' 件 · 行囊 '+S.bag.length+' 件</span></div>'
    + '<div class="prow"><span>走过的年头</span><span>'+S.turn+' 年</span></div>'
    + '<div class="prow"><span>声望 / 恩怨</span><span>'+S.fame+' · 仇怨 '+S.enemy+'</span></div>';
  renderAll();
  $('ov-end').classList.remove('in');
}

/* ---------- 21. 开局 ---------- */

function rollBox(tal){

    + '<div class="prow"><span>根骨</span><span>'+tal.bone+'<em>×'+tal.boneMul.toFixed(2)+'</em></span></div>'

}

function showOpening(){

  entry('sys','','灵根 '+esc(S.rootName)+'（'+S.rootEl+' 属 · ×'+S.rootMul.toFixed(2)+'）· 根骨 '+S.bone+'（×'+S.boneMul.toFixed(2)+'）· 时年 '+S.age+' 岁 · 寿元 '+S.lifespan+' 载', null);

}

$('btn-again').onclick = showOpening;
$('btn-drawer').onclick = e=>{ $('drawer').classList.toggle('open'); e.target.classList.toggle('on'); };
$('btn-eng').onclick = e=>{ document.body.classList.toggle('show-eng'); e.target.classList.toggle('on'); };
document.addEventListener('click', e=>{
  const dr = $('drawer');
  if(!dr.classList.contains('open')) return;
  if(dr.contains(e.target)) return;
  if(e.target.closest && e.target.closest('#btn-drawer')) return;
  dr.classList.remove('open');
  $('btn-drawer').classList.remove('on');
});
$('btn-fold').onclick = ()=>{
  sealTurn();
  const ds = document.querySelectorAll('.turn');
  Array.prototype.forEach.call(ds, d=>{ d.open=false; });
  if(ds.length) ds[ds.length-1].open = true;
  logEl.scrollTop = logEl.scrollHeight;
};
$('btn-all').onclick = ()=>{
  sealTurn();
  Array.prototype.forEach.call(document.querySelectorAll('.turn'), d=>{ d.open=true; });
};
$('btn-re').onclick = ()=>{ if(confirm('重新开始？本局进度将清空。')) location.reload(); };

newGame();
$('cards').style.display='none';
showOpening();
</script>
</body>
</html>
